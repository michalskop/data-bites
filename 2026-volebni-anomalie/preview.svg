<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad-anomaly" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="640" height="400" fill="url(#bg-grad-anomaly)"/>

  <!-- Subtle Coordinate / Map Grid -->
  <path d="M 0 80 L 640 80 M 0 160 L 640 160 M 0 240 L 640 240 M 0 320 L 640 320" stroke="#334155" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>
  <path d="M 120 0 L 120 400 M 240 0 L 240 400 M 360 0 L 360 400 M 480 0 L 480 400" stroke="#334155" stroke-width="1" stroke-dasharray="3 4" opacity="0.4"/>

  <!-- Stylized Czech outline nodes / connections -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.2" fill="none">
    <path d="M 140 200 L 220 180 L 310 190 L 410 220 L 510 200 L 480 260 L 390 280 L 280 270 L 190 260 Z"/>
    <path d="M 220 180 L 320 230 L 410 220"/>
  </g>

  <!-- Top Badges & Title -->
  <text x="32" y="42" font-family="'Work Sans', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">FORENSNÍ VOLEBNÍ SCREENING • 2026</text>
  <text x="32" y="70" font-family="'Roboto Slab', Georgia, serif" font-size="20" font-weight="700" fill="#f8fafc">Detekované volební anomálie</text>

  <!-- Anomaly Target 1: Žďár / Milešín -->
  <circle cx="370" cy="230" r="32" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="370" cy="230" r="14" fill="rgba(239, 68, 68, 0.25)"/>
  <circle cx="370" cy="230" r="5" fill="#ef4444" filter="url(#glow)"/>
  <g transform="translate(390, 205)" filter="url(#shadow-dark)">
    <rect width="165" height="34" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
    <text x="10" y="15" font-family="'Work Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">ŽĎÁR NAD SÁZAVOU</text>
    <text x="10" y="27" font-family="'Work Sans', sans-serif" font-size="9.5" font-weight="500" fill="#fca5a5">Milešín • Revize hlasů senát</text>
  </g>

  <!-- Anomaly Target 2: Kladno -->
  <circle cx="250" cy="180" r="22" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="250" cy="180" r="10" fill="rgba(245, 158, 11, 0.25)"/>
  <circle cx="250" cy="180" r="4" fill="#f59e0b" filter="url(#glow)"/>
  <g transform="translate(130, 150)" filter="url(#shadow-dark)">
    <rect width="115" height="34" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="10" y="15" font-family="'Work Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">KLADNO (Okrsek 29)</text>
    <text x="10" y="27" font-family="'Work Sans', sans-serif" font-size="9.5" font-weight="500" fill="#fde68a">Hlasy pro Kladeňáky</text>
  </g>

  <!-- Anomaly Target 3: Brno-střed -->
  <circle cx="430" cy="280" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="430" cy="280" r="8" fill="rgba(56, 189, 248, 0.25)"/>
  <circle cx="430" cy="280" r="4" fill="#38bdf8"/>
  <g transform="translate(450, 270)" filter="url(#shadow-dark)">
    <rect width="125" height="30" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="8" y="14" font-family="'Work Sans', sans-serif" font-size="10" font-weight="700" fill="#f8fafc">BRNO-STŘED</text>
    <text x="8" y="24" font-family="'Work Sans', sans-serif" font-size="9" font-weight="500" fill="#bae6fd">Nula pro vítěznou stranu</text>
  </g>

  <!-- Anomaly Target 4: Praha -->
  <circle cx="280" cy="195" r="14" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
  <circle cx="280" cy="195" r="4" fill="#a855f7"/>

  <!-- Bottom Legend Bar -->
  <g transform="translate(32, 350)" filter="url(#shadow-dark)">
    <rect width="320" height="28" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <text x="26" y="18" font-family="'Work Sans', sans-serif" font-size="10.5" font-weight="600" fill="#f8fafc">Chyby obálek</text>
    <circle cx="120" cy="14" r="4" fill="#f59e0b"/>
    <text x="130" y="18" font-family="'Work Sans', sans-serif" font-size="10.5" font-weight="600" fill="#f8fafc">Prohození hlasů</text>
    <circle cx="230" cy="14" r="4" fill="#38bdf8"/>
    <text x="240" y="18" font-family="'Work Sans', sans-serif" font-size="10.5" font-weight="600" fill="#f8fafc">Nulové anomálie</text>
  </g>
</svg>
