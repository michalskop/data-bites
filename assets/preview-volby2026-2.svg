<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad-v2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3f1e9"/>
    </radialGradient>
    <filter id="shadow-v2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101432" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg-grad-v2)"/>

  <!-- Subtle Pattern -->
  <path d="M 0 100 L 640 100 M 0 200 L 640 200 M 0 300 L 640 300" stroke="#e8e8dc" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 160 0 L 160 400 M 320 0 L 320 400 M 480 0 L 480 400" stroke="#e8e8dc" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Header -->
  <text x="36" y="44" font-family="'Work Sans', sans-serif" font-size="12" font-weight="700" fill="#de1743" letter-spacing="1.5">SENÁTNÍ VOLBY 2026 • FINÁLE</text>
  <text x="36" y="74" font-family="'Roboto Slab', Georgia, serif" font-size="22" font-weight="700" fill="#101432">Senát 2026 · 2. kolo · predikce</text>

  <!-- Duel Card 1 -->
  <g transform="translate(36, 115)" filter="url(#shadow-v2)">
    <rect width="568" height="96" rx="6" fill="#ffffff" stroke="#e8e8dc" stroke-width="1"/>
    <text x="18" y="24" font-family="'Work Sans', sans-serif" font-size="12" font-weight="700" fill="#6267a3">OBVOD 21 – PRAHA 5</text>
    <text x="550" y="24" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" fill="#0e839e" text-anchor="end">Model: 86 % jistota</text>
    
    <!-- Candidates Row -->
    <text x="18" y="52" font-family="'Roboto Slab', Georgia, serif" font-size="15" font-weight="700" fill="#101432">Kandidát A</text>
    <text x="550" y="52" font-family="'Roboto Slab', Georgia, serif" font-size="15" font-weight="700" fill="#101432" text-anchor="end">Kandidát B</text>

    <!-- Gauge / Probability bar -->
    <rect x="18" y="64" width="532" height="14" rx="4" fill="#e8e8dc"/>
    <rect x="18" y="64" width="310" height="14" rx="4" fill="#de1743"/>
    <line x1="284" y1="60" x2="284" y2="82" stroke="#101432" stroke-width="2" stroke-dasharray="2 2"/>

    <text x="24" y="90" font-family="'Work Sans', sans-serif" font-size="11" font-weight="700" fill="#de1743">58,2 % šance na mandát</text>
    <text x="544" y="90" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" fill="#6267a3" text-anchor="end">41,8 %</text>
  </g>

  <!-- Duel Card 2 -->
  <g transform="translate(36, 230)" filter="url(#shadow-v2)">
    <rect width="568" height="96" rx="6" fill="#ffffff" stroke="#e8e8dc" stroke-width="1"/>
    <text x="18" y="24" font-family="'Work Sans', sans-serif" font-size="12" font-weight="700" fill="#6267a3">OBVOD 59 – BRNO-MĚSTO</text>
    <text x="550" y="24" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" fill="#f76800" text-anchor="end">Vyrovnaný souboj (50/50)</text>

    <text x="18" y="52" font-family="'Roboto Slab', Georgia, serif" font-size="15" font-weight="700" fill="#101432">Kandidát C</text>
    <text x="550" y="52" font-family="'Roboto Slab', Georgia, serif" font-size="15" font-weight="700" fill="#101432" text-anchor="end">Kandidát D</text>

    <rect x="18" y="64" width="532" height="14" rx="4" fill="#e8e8dc"/>
    <rect x="18" y="64" width="270" height="14" rx="4" fill="#0e839e"/>
    <line x1="284" y1="60" x2="284" y2="82" stroke="#101432" stroke-width="2" stroke-dasharray="2 2"/>

    <text x="24" y="90" font-family="'Work Sans', sans-serif" font-size="11" font-weight="700" fill="#0e839e">50,8 %</text>
    <text x="544" y="90" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" fill="#6267a3" text-anchor="end">49,2 %</text>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(36, 360)">
    <text x="0" y="16" font-family="'Work Sans', sans-serif" font-size="12" font-weight="600" fill="#6267a3">volby2026-2.datatimes.cz ↗</text>
  </g>
</svg>
